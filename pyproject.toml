[project]
name = "weight-space-programming"
version = "0.1.0"
description = "Weight-Space Programming harness: let an LLM Read / Fix / Write neural-network weights directly, applied to 3D CAD SDFs and drawing-feature classifiers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "torch>=2.4",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# LLM agent (Claude via the official Anthropic SDK). The scripted reference agents need none of this.
llm = ["anthropic>=2.4"]

[project.scripts]
wsp = "wsp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: trains small networks (seconds to tens of seconds on CPU)",
]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:skimage",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", # Japanese full-width characters in strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/wsp/agents/snippets/*.py" = ["F821"] # `weights` / `meta` are injected by the sandbox
